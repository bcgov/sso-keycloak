name: Gold Custom Request
description: File a gold custom request
title: "[Gold Custom]: "
labels: ["gold", "custom"]
assignees:
  - tzhang200,zsamji
body:
  - type: markdown
    attributes:
      value: |
        Please reachout to us if you have any questions:  bcgov.sso@gov.bc.ca  or [Our Microsoft teams channel](https://teams.microsoft.com/l/channel/19%3A35d0b3389e39479590ba45a19a67a3ba%40thread.tacv2/SSOKeycloak-howto?groupId=a80418da-c27b-406e-89ab-7695b61924d8&tenantId=6fdb5200-3d0d-4a8a-b036-d3685e359adc)
  - type: input
    id: po-contact
    attributes:
      label: Product Owner Contact Details
      description: How can we get in touch with you if we need more info?
      placeholder: ex. email@example.com
    validations:
      required: true
  - type: input
    id: to-contact
    attributes:
      label: Technical Owner Contact Details
      description: How can we get in touch with you if we need more info?
      placeholder: ex. email@example.com
    validations:
      required: true
  - type: input
    id: 2-to-contact
    attributes:
      label: Secondary Technical Owner Contact Details
      description: How can we get in touch with you if we need more info?
      placeholder: ex. email@example.com
    validations:
      required: false
  - type: dropdown
    id: existing-realm
    attributes:
      label: Silver custom realm name
      description: Please pick your SILVER custom realm name from the list below
      options:
        - tz0e228w
        - sbtyffu4
        - ezb8kej4
    validations:
      required: true
  - type: input
    id: new-realm-name
    attributes:
      label: New realm name
      description: new realm name syntax less that 10 characters and a meaningful name. Please note that if there are any duplicate names, we will ask you to resubmit with another name.
      placeholder: ex. myrealmname
    validations:
      required: true
  - type: checkboxes
    id: gold-env
    attributes:
      label: Gold environment needed
      description: Which env
      options:
      - label: Dev
      - label: Test
      - label: Prod
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ## Additional Information ##
        Please create your IDP via our [Common Hosted Single Sign on App](https://sso-requests.apps.gold.devops.gov.bc.ca/)
        [How to guide can be found here](https://stackoverflow.developer.gov.bc.ca/questions/864)
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Gold Custom Realm Community Ways of Working](https://github.com/bcgov/sso-keycloak/wiki/Gold-Custom-Realm-Community-Ways-of-Working)
      options:
        - label: I agree to follow Pathfinder SSO's Gold Custom Realm Community Ways of Working
          required: true
